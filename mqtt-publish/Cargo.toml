[package]
name = "mqtt-publish"
version = "0.2.0"
edition = "2021"
description = "Lightweight MQTT publish client for CCNotify"

[dependencies]
rumqttc = "0.25"
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
